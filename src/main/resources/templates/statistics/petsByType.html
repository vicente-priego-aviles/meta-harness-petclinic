<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'statistics')}">

<body>

  <h2 th:text="#{statistics}">Statistics</h2>

  <p class="lead">
    <span th:text="#{statistics.total}">Total pets</span>:
    <strong th:text="${total}">13</strong>
  </p>

  <svg class="stats-chart" role="img" aria-labelledby="stats-chart-title" th:attr="viewBox='0 0 400 ' + ${rows.size() * 28 + 4}" preserveAspectRatio="xMinYMin meet"
    xmlns="http://www.w3.org/2000/svg">
    <title id="stats-chart-title" th:text="#{statistics.chartTitle}">Pets by type</title>
    <g th:each="row, i : ${rows}" th:attr="transform='translate(0,' + ${i.index * 28 + 2} + ')'">
      <text x="0" y="16" class="stats-label" th:text="${row.name}">cat</text>
      <rect x="90" y="2" height="20" rx="2" th:class="'stats-bar stats-bar-' + ${i.index % 8}"
        th:attr="width=${row.barWidth}"></rect>
      <text y="16" class="stats-value" th:attr="x=${90 + row.barWidth + 6}"
        th:text="${row.count}">4</text>
    </g>
  </svg>

  <ul class="stats-legend list-unstyled">
    <li th:each="row, i : ${rows}">
      <span th:class="'stats-swatch stats-bar-' + ${i.index % 8}"></span>
      <span th:text="${row.name}">cat</span>:
      <span th:text="${row.count}">4</span>
      (<span th:text="${#numbers.formatDecimal(row.percent, 1, 1)}">30.8</span>%)
    </li>
  </ul>

  <div class="table-responsive">
    <table id="petsByType" class="table table-striped">
      <thead>
        <tr>
          <th th:text="#{statistics.type}">Type</th>
          <th th:text="#{statistics.pets}">Pets</th>
          <th th:text="#{statistics.percent}">%</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="row : ${rows}">
          <td th:text="${row.name}">cat</td>
          <td th:text="${row.count}">4</td>
          <td><span th:text="${#numbers.formatDecimal(row.percent, 1, 1)}">30.8</span>%</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th th:text="#{statistics.total}">Total pets</th>
          <th th:text="${total}">13</th>
          <th><span th:text="${#numbers.formatDecimal(total == 0 ? 0 : 100, 1, 1)}">100.0</span>%</th>
        </tr>
      </tfoot>
    </table>
  </div>

</body>

</html>
